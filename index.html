<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krinkled</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Screen 1 — Loader_01 -->
  <div class="screen screen--loading" id="screen-1">
    <div class="loader-inner">
      <img class="loader-sticker loader-sticker--wiggle" src="Assets/Loader_01.png" alt="" />
      <p class="loader-label">Loading Chat History<span class="ellipsis"></span></p>
    </div>
  </div>

  <!-- Screen 2 — Loader_08 -->
  <div class="screen screen--loading screen--hidden" id="screen-2">
    <div class="loader-inner">
      <img class="loader-sticker loader-sticker--wiggle" src="Assets/Loader_08.png" alt="" />
      <p class="loader-label">Analysing Messages<span class="ellipsis"></span></p>
    </div>
  </div>

  <script>
    /* Ellipsis: cycle . → .. → ... every 500 ms, fixed-width span keeps label stable */
    var DOTS = ['.', '..', '...'];
    var tick = 0;
    function stepEllipsis() {
      var text = DOTS[tick % 3];
      document.querySelectorAll('.ellipsis').forEach(function (el) { el.textContent = text; });
      tick++;
    }
    stepEllipsis();
    setInterval(stepEllipsis, 500);

    /* Loading sequence: screen 1 → screen 2 → both hidden */
    var s1 = document.getElementById('screen-1');
    var s2 = document.getElementById('screen-2');

    setTimeout(function () {
      s1.classList.add('screen--hidden');
      s2.classList.remove('screen--hidden');
    }, 1500);

    setTimeout(function () {
      s2.classList.add('screen--hidden');
    }, 3000);
  </script>

</body>
</html>
